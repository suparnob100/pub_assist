<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pub Assist emblem">
  <!-- Decorative seal rings -->
  <circle cx="32" cy="32" r="30" fill="#FFFFFF" stroke="#7B2230" stroke-width="1.6"/>
  <circle cx="32" cy="32" r="26" fill="none" stroke="#9C7A2E" stroke-width="1"/>

  <!-- Radiating tick marks around the seal -->
  <g stroke="#9C7A2E" stroke-width="1" stroke-linecap="round">
    <line x1="32" y1="3.5" x2="32" y2="6.5"/>
    <line x1="60.5" y1="32" x2="57.5" y2="32"/>
    <line x1="32" y1="60.5" x2="32" y2="57.5"/>
    <line x1="3.5" y1="32" x2="6.5" y2="32"/>
    <line x1="52.1" y1="11.9" x2="50" y2="14"/>
    <line x1="52.1" y1="52.1" x2="50" y2="50"/>
    <line x1="11.9" y1="52.1" x2="14" y2="50"/>
    <line x1="11.9" y1="11.9" x2="14" y2="14"/>
  </g>

  <!-- Manuscript page (tilted) -->
  <g transform="rotate(-7 32 33)">
    <path d="M22 17 H38 L43 22 V49 H22 Z" fill="#FCFBF7" stroke="#7B2230" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M38 17 V22 H43 Z" fill="#F1E6CE" stroke="#7B2230" stroke-width="1.1" stroke-linejoin="round"/>
    <g stroke="#9C7A2E" stroke-width="1.3" stroke-linecap="round">
      <line x1="26" y1="28" x2="38" y2="28"/>
      <line x1="26" y1="32" x2="39" y2="32"/>
      <line x1="26" y1="36" x2="38" y2="36"/>
      <line x1="26" y1="40" x2="34" y2="40"/>
    </g>
  </g>

  <!-- Quill pen crossing the page -->
  <g transform="rotate(-7 32 33)">
    <path d="M47 13 C40 20 33 33 29.5 44 C33 41 41 33 47 13 Z"
          fill="#7B2230" stroke="#5E1822" stroke-width="0.8" stroke-linejoin="round"/>
    <path d="M44.5 17 C39 24 34 33 30.5 42" stroke="#FCFBF7" stroke-width="0.8" stroke-linecap="round" opacity="0.7"/>
    <path d="M29.5 44 L27 50 L31 47 Z" fill="#20180F"/>
  </g>
</svg>
